<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Work Planner — Accesso</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f7fb;color:#102b46;font-family:"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border:1px solid #dfe8f1;border-radius:20px;box-shadow:0 12px 35px #173d5915;padding:28px}.logo{width:48px;height:48px;border-radius:14px;background:#0b4b7d;color:#fff;display:grid;place-items:center;font-size:26px;margin-bottom:14px}h1{margin:0 0 8px;font-size:25px}p{color:#607b96;line-height:1.5}.tabs{display:flex;gap:5px;margin:20px 0}.tabs button{flex:1;border:0;padding:11px;border-radius:10px;background:#e8eff6;color:#17324c;font-weight:800;cursor:pointer}.tabs button.active{background:#138f8a;color:#fff}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #cad9e7;border-radius:10px;font-size:16px}.main{width:100%;border:0;border-radius:10px;padding:13px;background:#138f8a;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}.msg{margin-top:12px;padding:11px;border-radius:10px;background:#f1f5f9}.err{background:#fef2f2;color:#991b1b}.ok{background:#ecfdf5;color:#065f46}.note{font-size:12px;margin-top:18px}
</style><script src="cloud-access.js"></script></head><body><main class="card"><div class="logo">✈</div><h1>Travel Work Planner</h1><p>Accedi al tuo spazio personale. Ogni utente vede e modifica esclusivamente i propri viaggi.</p><div class="tabs"><button id="loginTab" class="active" type="button">Accedi</button><button id="registerTab" type="button">Crea account</button></div><form id="form"><div class="field"><label>Nome utente</label><input id="username" autocomplete="username" required minlength="3" maxlength="40"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8"></div><button class="main" id="submit">Accedi</button></form><div id="msg" class="msg hidden"></div><p class="note">La password non viene salvata in chiaro nel database.</p></main><script>
const $=id=>document.getElementById(id);let mode='login';
function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('registerTab').classList.toggle('active',m==='register');$('submit').textContent=m==='login'?'Accedi':'Crea account';$('password').autocomplete=m==='login'?'current-password':'new-password';$('msg').className='msg';$('msg').textContent='';}
$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');
(async()=>{try{const t=localStorage.getItem('twp_auth_token_v26');if(t){const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+t}});if(r.ok)location.replace('Home.html')}}catch(e){}})();
$('form').onsubmit=async e=>{e.preventDefault();const b={username:$('username').value.trim(),password:$('password').value};$('submit').disabled=true;$('msg').className='msg';$('msg').textContent=mode==='login'?'Accesso in corso…':'Creazione account in corso…';try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Operazione non riuscita');localStorage.setItem('twp_auth_token_v26',d.token);location.replace('Home.html')}catch(err){$('msg').className='msg err';$('msg').textContent=err.message||'Errore'}finally{$('submit').disabled=false}};
</script></body></html>
